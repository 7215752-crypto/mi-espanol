button{

.example-number{

.blank{

.hintbox{

.feedback{

.choice{

.choice.correct-choice{

.actionbar{margin:12px 0}

function naturalExamples(item){

  const key =
    norm(item?.spanish || current?.expected || '');

  if(EXAMPLES[key])
    return EXAMPLES[key];


  const s =
    item?.spanish || current?.expected || '';


  if(item?.item_type==='verb'){

    return [
      `Quiero ${s} esta semana.`,
      `Ayer intenté ${s}, pero no pude.`
    ];

  }


  if(item?.item_type==='expression'){

    return [
      `Escuché «${s}» en una conversación.`,
      `Hoy intenté usar «${s}» al hablar.`
    ];

  }


  return [
    `Vi «${s}» en un texto en español.`,
    `Hoy aprendí a usar «${s}» correctamente.`
  ];

}



/* =========================================================
   AUDIO
   ========================================================= */

function speakSpanish(text){

  if(
    !text ||
    !('speechSynthesis' in window)
  )
    return;


  window.speechSynthesis.cancel();


  const u =
    new SpeechSynthesisUtterance(text);


  u.lang='es-AR';

  u.rate=.88;


  const voices =
    window.speechSynthesis.getVoices();


  u.voice =
    voices.find(v=>/^es-AR/i.test(v.lang))
    ||
    voices.find(v=>/^es(-|_)/i.test(v.lang))
    ||
    null;


  window.speechSynthesis.speak(u);

}



/* =========================================================
   API
   ========================================================= */

function hdr(auth=true){

  const h={
    apikey:KEY,
    'Content-Type':'application/json'
  };


  if(auth && session?.access_token)
    h.Authorization='Bearer '+session.access_token;


  return h;

}



async function api(path,opt={}){

  const r =
    await fetch(
      SB+path,
      {
        ...opt,
        headers:{
          ...hdr(opt.auth!==false),
          ...(opt.headers||{})
        }
      }
    );


  const t =
    await r.text();


  let d=null;


  try{

    d=t ? JSON.parse(t) : null;

  }catch{

    d=t;

  }


  if(!r.ok){

    throw new Error(
      d?.msg ||
      d?.message ||
      d?.error_description ||
      'HTTP '+r.status
    );

  }


  return d;

}



/* =========================================================
   AUTH
   ========================================================= */

async function signin(){

  try{

    const d =
      await api(
        '/auth/v1/token?grant_type=password',
        {
          method:'POST',
          auth:false,

          body:JSON.stringify({

            email:
              $('email').value.trim(),

            password:
              $('password').value

          })

        }
      );


    session=d;


    localStorage.setItem(
      'mi_espanol_session',
      JSON.stringify(d)
    );


    start();


  }catch(e){

    $('authMsg').textContent=e.message;

  }

}



async function signup(){

  try{

    const email=
      $('email').value.trim();


    const password=
      $('password').value;


    if(!email || !password){

      $('authMsg').textContent =
        'Enter email and password.';

      return;

    }


    const d =
      await api(
        '/auth/v1/signup?redirect_to='
        +encodeURIComponent(location.origin),

        {

          method:'POST',

          auth:false,

          body:JSON.stringify({
            email,
            password
          })

        }
      );


    $('authMsg').textContent =
      d.access_token
      ? 'Account created.'
      : 'Check your email to confirm your account.';


  }catch(e){

    $('authMsg').textContent=e.message;

  }

}



function logout(){

  localStorage.removeItem(
    'mi_espanol_session'
  );

  location.reload();

}



/* =========================================================
   LOAD DATA
   ========================================================= */

async function load(){

  items =
    await api(
      '/rest/v1/study_items'
      +'?select=*'
      +'&active=eq.true'
      +'&order=spanish.asc'
    );


  progress =
    await api(
      '/rest/v1/progress?select=*'
    );


  lessons =
    await api(
      '/rest/v1/lessons'
      +'?select=*'
      +'&order=created_at.asc'
    );

}



function pm(){

  return new Map(
    progress.map(
      x=>[x.item_id,x]
    )
  );

}



async function start(){

  try{

    $('authView').style.display='none';

    $('appView').style.display='block';


    await load();


    render();


  }catch(e){

    $('authMsg').textContent=e.message;

    $('authView').style.display='block';

    $('appView').style.display='none';

  }

}



/* =========================================================
   RENDER
   ========================================================= */

function render(){

  renderStats();

  renderVocab();

  renderVerbs();

  renderLessons();

  renderGrammar();

  renderMistakes();

}



function renderStats(){

  const p=pm();

  const now=Date.now();


  let mastered=0;

  let mistakes=0;

  let due=0;


  items.forEach(x=>{

    const q=p.get(x.id);


    if(q?.mastery_score>=70)
      mastered++;


    if(
      ['almost','incorrect']
      .includes(q?.last_result)
    )
      mistakes++;


    if(
      !q ||
      !q.next_review_at ||
      new Date(q.next_review_at)<=now
    )
      due++;

  });


  $('stTotal').textContent=
    items.length;


  $('stMastered').textContent=
    mastered;


  $('stMistakes').textContent=
    mistakes;


  $('stDue').textContent=
    due;


  $('statsBox').innerHTML=`

    <h2>Study statistics</h2>

    <p>
      Total:
      <b>${items.length}</b>
    </p>

    <p>
      Mastered:
      <b>${mastered}</b>
    </p>

    <p>
      Mistakes:
      <b>${mistakes}</b>
    </p>

    <p>
      Due / new:
      <b>${due}</b>
    </p>

  `;

}



function bindSpeak(){

  document
    .querySelectorAll('[data-speak]')
    .forEach(b=>{

      b.onclick=e=>{

        e.stopPropagation();

        speakSpanish(
          b.dataset.speak
        );

      };

    });

}

function switchTab(tab){

  document
    .querySelectorAll('.nav button')
    .forEach(
      x=>
        x.classList.toggle(
          'active',
          x.dataset.tab===tab
        )
    );


  document
    .querySelectorAll('.panel')
    .forEach(
      x=>
        x.classList.toggle(
          'active',
          x.id===tab
        )
    );

}



function pool(){

  const p=pm();

  const scope=
    $('scope').value;

  const now=
    Date.now();


  let a=
    items.filter(
      x=>

      ['word','expression','verb']
      .includes(x.item_type)

      &&

      x.english
    );


  if(scope==='mistakes'){

    a=a.filter(
      x=>

      ['almost','incorrect']
      .includes(
        p.get(x.id)?.last_result
      )
    );

  }


  if(scope==='due'){

    a=a.filter(x=>{

      const q=
        p.get(x.id);


      return (
        !q
        ||
        !q.next_review_at
        ||
        new Date(q.next_review_at)<=now
      );

    });

  }


  return a;

}



function rand(a){

  return a[
    Math.floor(
      Math.random()*a.length
    )
  ];

}



function startPractice(){

  queue=
    pool()
    .sort(
      ()=>Math.random()-.5
    );


  qi=0;


  nextQuestion();

}

function renderExamples(reveal){

  if(!current){

    $('examplesBox').style.display=
      'none';

    return;

  }


  const target=
    current.expected;


  const examples=
    current.examples || [];


  $('examplesBox').innerHTML=

    `<div class="examples-title">
       Examples
     </div>`

    +

    examples
      .map(
        (sentence,i)=>{

          let shown=
            sentence;


          if(!reveal){

            shown=
              sentence
              .split(target)
              .join('_____');

          }


          return `

          <div class="example">

            <span class="example-number">
              ${i+1}.
            </span>

            ${esc(shown)}

          </div>

          `;

        }
      )
      .join('');


  $('examplesBox').style.display=
    'block';

}

   QUESTIONS
   ========================================================= */

function grammarQuestion(){

  const qs=[

    {

      q:
      'Choose the correct form: “Yesterday I went home.”',

      answer:
      'Ayer fui a casa.',

      wrong:[
        'Ayer iba a casa.',
        'Ayer fue a casa.',
        'Ayer soy a casa.'
      ],

      examples:[
        'Ayer fui a casa temprano.',
        'Después fui a cenar con unos amigos.'
      ]

    },


    {

      q:
      'Choose the habitual past form: “I used to travel to Bariloche.”',

      answer:
      'Solía viajar a Bariloche.',

      wrong:[
        'Suelo viajar a Bariloche.',
        'Viajé a Bariloche.',
        'Solé viajar a Bariloche.'
      ],

      examples:[
        'Solía viajar a Bariloche todos los inviernos.',
        'Cuando era más joven, solía viajar mucho.'
      ]

    },


    {

      q:
      'Which construction means “to remember”?',

      answer:
      'acordarse de',

      wrong:[
        'acordar a',
        'acostumbrarse de',
        'olvidarse a'
      ],

      examples:[
        'Me acordé de tu mensaje.',
        '¿Te acordás de esa película?'
      ]

    }

  ];


  return rand(qs);

}



function nextQuestion(){

  clearTimeout(autoTimer);


  answered=false;

  hintLevel=0;


  $('hint').textContent='Hint';

  $('feedback').className='';

  $('feedback').innerHTML='';

  $('choices').innerHTML='';

  $('hintBox').style.display='none';

  $('hintBox').innerHTML='';

  $('answer').value='';

  $('answer').style.display='block';


  if(!queue.length && mode!=='grammar'){

    $('prompt').textContent=
      'Nothing in this set right now.';

    $('subprompt').textContent=
      'Try “All material”.';

    $('examplesBox').style.display='none';

    return;

  }


  const type=
    mode==='mixed'
    ?
    rand([
      'typing',
      'multiple',
      'verbs',
      'grammar'
    ])
    :
    mode;



  if(type==='verbs'){

    const vp=
      items.filter(
        x=>

        x.item_type==='verb'

        &&

        x.conjugation

        &&

        Object.keys(
          x.conjugation
        ).length
      );


    const v=
      rand(vp);


    const persons=
      Object.keys(
        v.conjugation
      );


    const person=
      rand(persons);


    const expected=
      v.conjugation[person];


    current={

      type,

      item:v,

      expected,

      person,

      examples:[
        `Ayer ${expected} antes de salir.`,
        `Después ${expected} otra vez.`
      ]

    };


    $('prompt').textContent=
      `Conjugate “${v.spanish}” in Pretérito`;


    $('subprompt').textContent=
      `${person} — ${v.english||''}`;

  }


  else if(type==='grammar'){

    const q=
      grammarQuestion();


    current={

      type,

      expected:q.answer,

      choices:[
        q.answer,
        ...q.wrong
      ]
      .sort(
        ()=>Math.random()-.5
      ),

      examples:
        q.examples

    };


    $('prompt').textContent=
      q.q;


    $('subprompt').textContent=
      'Grammar from your lessons';


    $('answer').style.display=
      'none';


    renderChoices();

  }


  else{

    const it=
      queue[
        qi%queue.length
      ];


    current={

      type,

      item:it,

      expected:
        it.spanish,

      examples:
        naturalExamples(it)

    };


    $('prompt').textContent=
      it.english;


    $('subprompt').textContent=
      type==='multiple'
      ?
      'Choose the Spanish answer'
      :
      'Type the Spanish answer';


    if(type==='multiple'){

      const distract=

        items

        .filter(
          x=>

          x.id!==it.id

          &&

          x.item_type===it.item_type

          &&

          x.spanish
        )

        .sort(
          ()=>Math.random()-.5
        )

        .slice(0,3)

        .map(
          x=>x.spanish
        );


      current.choices=

        [
          it.spanish,
          ...distract
        ]

        .sort(
          ()=>Math.random()-.5
        );


      $('answer').style.display=
        'none';


      renderChoices();

    }

  }


  $('counter').textContent=

    (qi+1)
    +' / '
    +Math.max(
      queue.length,
      1
    );


  renderExamples(false);


  if(!current.choices){

    setTimeout(
      ()=>$('answer').focus(),
      80
    );

  }

}

/* =========================================================
   HINTS
   ========================================================= */

function revealPattern(s,n){

  let seen=0;


  return [...s]
    .map(ch=>{

      if(
        /[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/
        .test(ch)
      ){

        seen++;

        return (
          seen<=n
          ?
          ch
          :
          '_'
        );

      }


      return ch;

    })
    .join(' ');

}



function hint(){

  if(!current || answered)
    return;


  hintLevel++;


  let msg='';


  if(current.choices){

    const wrong=

      [
        ...document
        .querySelectorAll('.choice')
      ]

      .filter(
        b=>

        norm(
          b.dataset.value
        )

        !==

        norm(
          current.expected
        )

        &&

        !b.classList.contains(
          'eliminated'
        )
      );


    if(wrong.length){

      rand(wrong)
        .classList
        .add('eliminated');

    }


    msg=
      'One wrong option has been removed. Press Hint again for another.';

  }


  else{

    const total=

      [...current.expected]
      .filter(
        ch=>
          /[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/
          .test(ch)
      )
      .length;


    const reveal=

      Math.min(
        hintLevel,
        total
      );


    msg=

      `Hint ${reveal}/${total}: `
      +
      revealPattern(
        current.expected,
        reveal
      );


    if(
      hintLevel===1
      &&
      current.item?.russian
    ){

      msg+=
        ` · Russian: ${current.item.russian}`;

    }

  }


  $('hint').textContent=
    'Hint '+hintLevel;


  $('hintBox').textContent=
    msg;


  $('hintBox').style.display=
    'block';

}



/* =========================================================
   CHECK ANSWERS
   ========================================================= */

function levenshtein(a,b){

  a=norm(a);

  b=norm(b);


  const d=
    Array.from(
      {
        length:a.length+1
      },
      ()=>
        Array(
          b.length+1
        )
        .fill(0)
    );


  for(let i=0;i<=a.length;i++)
    d[i][0]=i;


  for(let j=0;j<=b.length;j++)
    d[0][j]=j;


  for(let i=1;i<=a.length;i++){

    for(let j=1;j<=b.length;j++){

      d[i][j]=Math.min(

        d[i-1][j]+1,

        d[i][j-1]+1,

        d[i-1][j-1]
        +
        (
          a[i-1]===b[j-1]
          ?
          0
          :
          1
        )

      );

    }

  }


  return d[a.length][b.length];

}



function gradeAnswer(a,e){

  if(
    norm(a)===norm(e)
  )
    return 'correct';


  if(
    strip(a)===strip(e)
  )
    return 'almost';


  const distance=
    levenshtein(a,e);


  return (
    distance===1

    ||

    (
      Math.max(
        a.length,
        e.length
      )>=12

      &&

      distance<=2
    )
  )
  ?
  'almost'
  :
  'incorrect';

}



async function choose(b){

  if(
    answered
    ||
    b.classList.contains(
      'eliminated'
    )
  )
    return;


  answered=true;


  const ans=
    b.dataset.value;


  const g=

    norm(ans)
    ===
    norm(current.expected)

    ?

    'correct'

    :

    'incorrect';


  document
    .querySelectorAll('.choice')
    .forEach(x=>{

      if(
        norm(x.dataset.value)
        ===
        norm(current.expected)
      ){

        x.classList.add(
          'correct-choice'
        );

      }

      else if(x===b){

        x.classList.add(
          'wrong-choice'
        );

      }

    });


  await showResult(
    g,
    ans
  );

}



async function check(){

  if(!current)
    return;


  if(answered){

    qi++;

    nextQuestion();

    return;

  }


  if(current.choices)
    return;


  const ans=
    $('answer').value.trim();


  if(!ans)
    return;


  answered=true;


  const g=
    gradeAnswer(
      ans,
      current.expected
    );


  await showResult(
    g,
    ans
  );

}



/* =========================================================
   RESULT
   ========================================================= */

async function showResult(g,ans){

  renderExamples(true);


  $('feedback').className=

    'feedback '

    +

    (
      g==='correct'
      ?
      'ok'
      :
      g==='almost'
      ?
      'almost'
      :
      'bad'
    );


  $('feedback').innerHTML=

    g==='correct'

    ?

    'Correct ✅ — next question…'

    :

    (
      g==='almost'
      ?
      'Almost. '
      :
      'Incorrect. '
    )

    +

    `Answer: <b>${esc(current.expected)}</b>`;



  speakSpanish(
    current.expected
  );



  if(current.item){

    try{

      await api(

        '/rest/v1/rpc/record_review',

        {

          method:'POST',

          body:JSON.stringify({

            p_item_id:
              current.item.id,

            p_typed_answer:
              ans,

            p_result:
              g,

            p_prompt:

              current.type==='verbs'

              ?

              `${current.item.spanish} / ${current.person}`

              :

              current.item.english,

            p_prompt_language:
              'en'

          })

        }

      );


      await load();


      renderStats();

      renderMistakes();


    }catch(e){

      console.error(e);

    }

  }



  if(g==='correct'){

    autoTimer=

      setTimeout(
        ()=>{

          qi++;

          nextQuestion();

        },
        1900
      );

  }

}
